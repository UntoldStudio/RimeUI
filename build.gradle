plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = mod_id
        }
    }
}

class PushChangesTask extends DefaultTask {
    @TaskAction
    void push() {
        def projectDir = project.rootProject.projectDir
        def status = runGit(projectDir, 'git', 'status', '--porcelain')
        if (status.trim().isEmpty()) {
            println '工作区没有需要提交的更改, 直接推送'
        } else {
            println '当前更改的文件:'
            println status
            println '请输入提交信息: '
            def reader = new BufferedReader(new InputStreamReader(System.in))
            def message = reader.readLine()
            if (message == null || message.trim().isEmpty()) {
                throw new GradleException('提交信息不能为空')
            }
            runGit(projectDir, 'git', 'add', '.')
            runGit(projectDir, 'git', 'commit', '-m', message)
        }
        runGit(projectDir, 'git', 'push', 'origin', 'HEAD')
        println '>>> 推送完成'
    }

    private static String runGit(File dir, String... args) {
        def proc = new ProcessBuilder(args)
                .directory(dir)
                .redirectErrorStream(true)
                .start()
        def output = proc.inputStream.text
        def exit = proc.waitFor()
        if (exit != 0) {
            throw new RuntimeException("Git command failed: ${args.join(' ')}\nError: ${output}")
        }
        return output
    }
}

tasks.register('pushChanges', PushChangesTask) {
    notCompatibleWithConfigurationCache("任务需要交互式输入并访问项目目录")
    description = '自动add、commit并推送当前分支'
}

class ReleaseVersionTask extends DefaultTask {
    @TaskAction
    void release() {
        def projectDir = project.rootProject.projectDir
        def tagName = project.version.toString()
        if (tagName == null || tagName.isEmpty() || tagName.contains('unspecified')) {
            throw new GradleException("版本号无效: '${tagName}', 请设置gradle.properties中的mod_version")
        }
        def status = runGit(projectDir, 'git', 'status', '--porcelain')
        if (status.trim().isEmpty()) {
            println '工作区没有需要提交的更改, 直接推送'
        } else {
            println '当前更改的文件:'
            println status
            println '请输入提交信息: '
            def reader = new BufferedReader(new InputStreamReader(System.in))
            def message = reader.readLine()
            if (message == null || message.trim().isEmpty()) {
                throw new GradleException('提交信息不能为空')
            }
            runGit(projectDir, 'git', 'add', '.')
            runGit(projectDir, 'git', 'commit', '-m', message)
        }
        runGit(projectDir, 'git', 'push', 'origin', 'HEAD')
        def remoteTags = runGit(projectDir, 'git', 'ls-remote', '--tags', 'origin')
        if (remoteTags.contains("refs/tags/${tagName}")) {
            throw new GradleException("远程仓库已存在标签'${tagName}', 请更新mod_version后再试")
        }
        runGit(projectDir, 'git', 'tag', '-a', tagName, '-m', "Release ${tagName}")
        runGit(projectDir, 'git', 'push', 'origin', tagName)
        println ">>> 发布完成! 标签${tagName}已推送, JitPack将开始构建"
    }

    private static String runGit(File dir, String... args) {
        def proc = new ProcessBuilder(args)
                .directory(dir)
                .redirectErrorStream(true)
                .start()
        def output = proc.inputStream.text
        def exit = proc.waitFor()
        if (exit != 0) {
            throw new RuntimeException("Git command failed: ${args.join(' ')}\nError: ${output}")
        }
        return output
    }
}

tasks.register('releaseVersion', ReleaseVersionTask) {
    notCompatibleWithConfigurationCache("任务需要交互式输入并访问项目目录")
    description = '自动add,commit,push并创建发布标签'
}